
name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate schema SQL
        env:
          NEXT_PUBLIC_HOCUSPOCUS_URL: ws://localhost:1234
          BETTER_AUTH_SECRET: ci-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          POLAR_ACCESS_TOKEN: ci-placeholder
          POLAR_PRODUCT_ID: ci-placeholder
          POLAR_WEBHOOK_SECRET: ci-placeholder
          HOCUSPOCUS_SECRET: ci-placeholder
        run: |
          cd apps/web
          # Keep the CLI version equal to the better-auth version in apps/web/package.json.
          NODE_PATH=../../node_modules pnpm dlx auth@1.6.11 generate --output /tmp/schema.sql
          echo "SCHEMA_B64=$(base64 -w 0 /tmp/schema.sql)" >> $GITHUB_ENV

      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/server:latest

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:latest
          build-args: |
            NEXT_PUBLIC_HOCUSPOCUS_URL=wss://dumpbook.ink/ws

      - name: Write env file to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > ~/dumpbook-web/.env.production << 'EOF'
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=https://dumpbook.ink
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            POLAR_ACCESS_TOKEN=${{ secrets.POLAR_ACCESS_TOKEN }}
            POLAR_PRODUCT_ID=${{ secrets.POLAR_PRODUCT_ID }}
            POLAR_WEBHOOK_SECRET=${{ secrets.POLAR_WEBHOOK_SECRET }}
            POLAR_SERVER=production
            HOCUSPOCUS_SECRET=${{ secrets.HOCUSPOCUS_SECRET }}
            EOF

      - name: Backup auth database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if ! command -v sqlite3 &>/dev/null; then
              apt-get install -y sqlite3
            fi
            DB=/var/lib/docker/volumes/dumpbook-web_web-data/_data/auth.sqlite
            if [ -f "$DB" ]; then
              mkdir -p ~/dumpbook-backups
              sqlite3 "$DB" ".backup '$HOME/dumpbook-backups/auth-$(date +%Y%m%d-%H%M%S).sqlite'"
              ls -1t ~/dumpbook-backups/auth-*.sqlite | tail -n +11 | xargs -r rm -f
              echo "Backed up auth.sqlite; keeping the 10 most recent snapshots."
            else
              echo "No auth.sqlite yet; skipping backup."
            fi

      - name: Migrate database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if ! command -v sqlite3 &>/dev/null; then
              apt-get install -y sqlite3
            fi
            mkdir -p /var/lib/docker/volumes/dumpbook-web_web-data/_data
            echo "${{ env.SCHEMA_B64 }}" | base64 -d | \
              sqlite3 /var/lib/docker/volumes/dumpbook-web_web-data/_data/auth.sqlite

      - name: Copy compose and nginx config to VPS
        # The VPS must run exactly what's in the repo; a hand-edited copy there
        # previously drifted (the server service lost its env_file).
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml,nginx/nginx.conf
          target: dumpbook-web

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/dumpbook-web
            # Authenticate with this run's short-lived GITHUB_TOKEN so pulls never
            # depend on a long-lived credential stored on the VPS.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Pick up nginx.conf changes even when the container wasn't recreated.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f
